<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credit Card Approval System</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body{
            background-color:#f4f7fc;
            padding:40px 20px;
        }

        .container{
            width:90%;
            max-width:1100px;
            margin:auto;
            background:white;
            padding:35px;
            border-radius:15px;
            box-shadow:0px 5px 20px rgba(0,0,0,0.1);
        }

        .header{
            text-align:center;
            margin-bottom:35px;
        }

        .header h1{
            color:#0d6efd;
            font-size:42px;
            margin-bottom:10px;
        }

        .header h2{
            color:#333;
            font-size:28px;
            margin-bottom:10px;
        }

        .header p{
            color:#666;
            font-size:16px;
        }

        .form-row{
            display:flex;
            gap:20px;
            margin-bottom:20px;
        }

        .form-group{
            flex:1;
        }

        label{
            display:block;
            font-weight:bold;
            margin-bottom:8px;
            color:#333;
        }

        input{
            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:8px;
            font-size:16px;
        }

        input:focus{
            outline:none;
            border-color:#0d6efd;
        }

        button{
            width:100%;
            padding:15px;
            background:#0d6efd;
            border:none;
            border-radius:8px;
            color:white;
            font-size:20px;
            font-weight:bold;
            cursor:pointer;
            margin-top:20px;
        }

        button:hover{
            background:#084298;
        }

        .result{
            margin-top:30px;
            padding:20px;
            text-align:center;
            background:#e7f3ff;
            border-radius:10px;
        }

        .result h2{
            color:#198754;
        }

        .footer{
            margin-top:40px;
            text-align:center;
            color:#777;
        }

        @media(max-width:768px){

            .form-row{
                flex-direction:column;
            }

            .header h1{
                font-size:32px;
            }

            .header h2{
                font-size:22px;
            }
        }

    </style>

</head>

<body>

<div class="container">

    <div class="header">

        <h1>WELCOME</h1>

        <h2>Credit Card Approval System</h2>

        <p>
            Enter applicant information below and click Predict
            to evaluate eligibility for credit card approval.
        </p>

    </div>

    <form action="{{ url_for('predict') }}" method="POST">

        <div class="form-row">

            <div class="form-group">
                <label>Gender</label>
                <input type="text" name="A1" required>
            </div>

            <div class="form-group">
                <label>Age</label>
                <input type="number" step="any" name="A2" required>
            </div>

        </div>

        <div class="form-row">

            <div class="form-group">
                <label>Debt Amount</label>
                <input type="number" step="any" name="A3" required>
            </div>

            <div class="form-group">
                <label>Marital Status</label>
                <input type="text" name="A4" required>
            </div>

        </div>

        <div class="form-row">

            <div class="form-group">
                <label>Bank Customer Status</label>
                <input type="text" name="A5" required>
            </div>

            <div class="form-group">
                <label>Education Level</label>
                <input type="text" name="A6" required>
            </div>

        </div>

        <div class="form-row">

            <div class="form-group">
                <label>Ethnicity</label>
                <input type="text" name="A7" required>
            </div>

            <div class="form-group">
                <label>Years Employed</label>
                <input type="number" step="any" name="A8" required>
            </div>

        </div>

        <div class="form-row">

            <div class="form-group">
                <label>Previous Default History</label>
                <input type="text" name="A9" required>
            </div>

            <div class="form-group">
                <label>Employment Status</label>
                <input type="text" name="A10" required>
            </div>

        </div>

        <div class="form-row">

            <div class="form-group">
                <label>Credit Score</label>
                <input type="number" step="any" name="A11" required>
            </div>

            <div class="form-group">
                <label>Driver License Status</label>
                <input type="text" name="A12" required>
            </div>

        </div>

        <div class="form-row">

            <div class="form-group">
                <label>Citizenship</label>
                <input type="text" name="A13" required>
            </div>

            <div class="form-group">
                <label>Zip Code</label>
                <input type="number" name="A14" required>
            </div>

        </div>

        <div class="form-row">

            <div class="form-group">
                <label>Annual Income</label>
                <input type="number" step="any" name="A15" required>
            </div>

        </div>

        <button type="submit">
            Predict Credit Approval
        </button>

    </form>

    {% if prediction_text %}
    <div class="result">
        <h2>{{ prediction_text }}</h2>
    </div>
    {% endif %}

    <div class="footer">
        <p>Designed by Collins Aboagye Addai</p>
    </div>

</div>

</body>
</html>
